<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07090e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Aura Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" id="pwa-manifest" />
  <style>
    :root { --bg: #07090e; --card-bg: rgba(22, 27, 38, 0.88); --card-border: rgba(255, 255, 255, 0.08); --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.35); --text: #f8fafc; --text-muted: #8899a6; --surface: rgba(15, 23, 42, 0.7); --heart-active: #f43f5e; --safe-bottom: env(safe-area-inset-bottom, 12px); }
    [data-theme="light"] { --bg: #f1f5f9; --card-bg: rgba(255, 255, 255, 0.92); --card-border: rgba(0, 0, 0, 0.08); --accent: #0ea5e9; --accent-glow: rgba(14, 165, 233, 0.3); --text: #0f172a; --text-muted: #64748b; --surface: rgba(241, 245, 249, 0.9); --heart-active: #e11d48; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg) 70%); color: var(--text); min-height: 100dvh; padding: 12px 12px calc(12px + var(--safe-bottom)); overflow-x: hidden; display: flex; justify-content: center; align-items: flex-start; transition: background 0.08s; }
    [data-theme="light"] body { background: radial-gradient(circle at 50% 0%, #e0f2fe 0%, var(--bg) 70%); }
    body.strobe-flash { background: #ffffff !important; }
    body.strobe-color-1 { background: radial-gradient(circle at 50% 50%, #f43f5e 0%, #07090e 90%) !important; }
    body.strobe-color-2 { background: radial-gradient(circle at 50% 50%, #38bdf8 0%, #07090e 90%) !important; }
    body.strobe-color-3 { background: radial-gradient(circle at 50% 50%, #a855f7 0%, #07090e 90%) !important; }
    body.strobe-color-4 { background: radial-gradient(circle at 50% 50%, #22c55e 0%, #07090e 90%) !important; }
    .player-container { background: var(--card-bg); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border: 1px solid var(--card-border); width: 100%; max-width: 420px; padding: 16px; border-radius: 24px; box-shadow: 0 20px 40px -12px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 12px; position: relative; transition: box-shadow 0.08s, transform 0.08s; }
    .strobe-pulse-card { transform: scale(1.02); box-shadow: 0 0 35px var(--accent) !important; }
    .top-bar { display: flex; gap: 8px; align-items: center; }
    .search-bar { flex: 1; display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--card-border); border-radius: 14px; padding: 4px 4px 4px 12px; align-items: center; }
    .search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .search-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 0.9rem; font-weight: 500; min-width: 0; }
    .search-input::placeholder { color: var(--text-muted); }
    .btn-action, .btn-icon { background: var(--accent); border: none; color: #030712; font-weight: 700; font-size: 0.8rem; padding: 10px 14px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s, opacity 0.2s; flex-shrink: 0; }
    .btn-action:active, .btn-icon:active { transform: scale(0.94); }
    .btn-icon { background: var(--surface); color: var(--text); border: 1px solid var(--card-border); width: 42px; height: 42px; padding: 0; }
    .btn-icon svg { width: 18px; height: 18px; }
    .tabs { display: flex; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 0.78rem; font-weight: 600; cursor: pointer; padding: 6px 10px; white-space: nowrap; position: relative; flex-shrink: 0; }
    .tab-btn.active { color: var(--accent); }
    .tab-btn.active::after { content: ""; position: absolute; bottom: -2px; left: 8px; right: 8px; height: 2px; background: var(--accent); border-radius: 2px; }
    .list-container { max-height: 160px; overflow-y: auto; background: var(--surface); border-radius: 14px; border: 1px solid var(--card-border); display: none; flex-direction: column; -webkit-overflow-scrolling: touch; }
    .list-container.show { display: flex; }
    .track-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; transition: background 0.15s; min-height: 56px; }
    .track-row:active, .track-row.active { background: rgba(56,189,248,0.12); }
    .track-thumb { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #1e293b; }
    .track-meta { flex: 1; overflow: hidden; text-align: left; min-width: 0; }
    .track-name { font-size: 0.84rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-channel { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .track-actions button { background: none; border: none; color: var(--text-muted); padding: 6px; border-radius: 8px; cursor: pointer; }
    .empty-state { padding: 20px 12px; font-size: 0.8rem; color: var(--text-muted); text-align: center; }
    .cover-wrapper { position: relative; width: 200px; height: 200px; margin: 4px auto 6px; display: flex; justify-content: center; align-items: center; }
    .cover-glow { position: absolute; width: 160px; height: 160px; border-radius: 22px; filter: blur(28px); opacity: 0.5; z-index: 1; background-size: cover; background-position: center; transition: background-image 0.4s ease; }
    .cover-art { position: relative; z-index: 2; width: 100%; height: 100%; border-radius: 18px; background-size: cover; background-position: center; background-color: #1e293b; box-shadow: 0 12px 28px rgba(0,0,0,0.55); border: 1px solid var(--card-border); transition: transform 0.35s ease, background-image 0.4s ease; }
    .cover-art.playing { transform: scale(1.04); }
    .viz { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; align-items: flex-end; height: 18px; z-index: 3; opacity: 0; transition: opacity 0.3s; }
    .viz.show { opacity: 0.85; }
    .viz span { width: 3px; background: var(--accent); border-radius: 2px; animation: bounce 0.8s ease-in-out infinite alternate; }
    .viz span:nth-child(1) { height: 6px; animation-delay: 0s; }
    .viz span:nth-child(2) { height: 12px; animation-delay: 0.15s; }
    .viz span:nth-child(3) { height: 9px; animation-delay: 0.3s; }
    .viz span:nth-child(4) { height: 15px; animation-delay: 0.1s; }
    .viz span:nth-child(5) { height: 7px; animation-delay: 0.25s; }
    @keyframes bounce { to { height: 4px; } }
    .track-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .track-desc { overflow: hidden; flex: 1; min-width: 0; }
    .current-title { font-size: 1.05rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .current-artist { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-heart { background: none; border: none; cursor: pointer; padding: 8px; color: var(--text-muted); transition: color 0.2s, transform 0.15s; }
    .btn-heart.active { color: var(--heart-active); }
    .btn-heart:active { transform: scale(1.25); }
    .timeline { width: 100%; display: flex; flex-direction: column; gap: 4px; }
    .time-stamps { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }
    input[type="range"] { width: 100%; -webkit-appearance: none; height: 6px; background: rgba(255,255,255,0.12); border-radius: 4px; outline: none; cursor: pointer; }
    [data-theme="light"] input[type="range"] { background: rgba(0,0,0,0.12); }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); cursor: pointer; }
    .vol-row { display: flex; align-items: center; gap: 10px; padding: 0 2px; }
    .vol-row svg { width: 18px; height: 18px; color: var(--text-muted); flex-shrink: 0; }
    .vol-slider { flex: 1; }
    .playback-controls { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 2px; }
    .btn-ctrl { background: none; border: none; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; transition: background 0.15s, transform 0.1s; }
    .btn-ctrl:active { transform: scale(0.9); background: rgba(255,255,255,0.08); }
    .btn-play { width: 64px; height: 64px; background: var(--accent); color: #030712; box-shadow: 0 8px 22px var(--accent-glow); }
    .btn-play:active { background: #7dd3fc; }
    .mode-btn.active { color: var(--accent); }
    .extra-row { display: flex; justify-content: space-around; align-items: center; gap: 4px; padding-top: 4px; border-top: 1px solid var(--card-border); }
    .extra-btn { background: none; border: none; color: var(--text-muted); font-size: 0.68rem; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 6px; border-radius: 10px; }
    .extra-btn svg { width: 18px; height: 18px; }
    .extra-btn.active, .extra-btn:active { color: var(--accent); }
    .extra-btn.strobe-on { color: #facc15 !important; animation: bounce 0.4s infinite alternate; }
    .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 90; display: none; align-items: flex-end; justify-content: center; }
    .sheet-overlay.show { display: flex; }
    .sheet { background: var(--card-bg); backdrop-filter: blur(24px); width: 100%; max-width: 420px; border-radius: 22px 22px 0 0; padding: 16px 16px calc(20px + var(--safe-bottom)); max-height: 75dvh; overflow-y: auto; border: 1px solid var(--card-border); }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .sheet-title { font-size: 1rem; font-weight: 700; }
    .sheet-close { background: var(--surface); border: none; color: var(--text); width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; }
    .sheet input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--surface); color: var(--text); font-size: 0.9rem; margin-bottom: 10px; }
    .sheet-btn { width: 100%; padding: 13px; border-radius: 12px; border: none; background: var(--accent); color: #030712; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
    .history-chip { display: inline-block; padding: 6px 12px; margin: 4px; border-radius: 20px; background: var(--surface); border: 1px solid var(--card-border); font-size: 0.78rem; color: var(--text); cursor: pointer; }
    .toast { position: fixed; bottom: calc(24px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(80px); background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 10px 18px; border-radius: 14px; font-size: 0.82rem; font-weight: 600; z-index: 100; opacity: 0; transition: all 0.3s ease; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    svg { fill: currentColor; width: 22px; height: 22px; }
    .btn-play svg { width: 28px; height: 28px; }
    .sleep-badge { position: absolute; top: 8px; right: 8px; background: var(--accent); color: #030712; font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 10px; z-index: 5; display: none; }
    .sleep-badge.show { display: block; }
    #yt-hidden-wrapper { position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
    .genre-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; transition: background 0.15s; min-height: 58px; }
    .genre-row:active { background: rgba(56,189,248,0.12); }
    .genre-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; color: #030712; flex-shrink: 0; }
    .genre-meta { flex: 1; min-width: 0; }
    .genre-name { font-size: 0.9rem; font-weight: 700; }
    .genre-desc { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .lyrics-container { display: flex; flex-direction: column; gap: 12px; text-align: center; padding: 10px 4px; }
    .lyric-line { font-size: 0.95rem; line-height: 1.6; color: var(--text-muted); transition: color 0.25s, font-size 0.25s, transform 0.25s; }
    .lyric-line.active { color: var(--accent); font-weight: 700; font-size: 1.15rem; transform: scale(1.04); }
  </style>
</head>
<body>
  <div class="player-container" id="player-container">
    <div class="sleep-badge" id="sleep-badge">Sleep 15m</div>

    <div class="top-bar">
      <div class="search-bar">
        <input type="text" id="search-input" class="search-input" placeholder="Search track or paste playlist link..." autocomplete="off" />
        <button class="btn-action" id="search-btn"><span>Find</span></button>
      </div>
      <button class="btn-icon" id="theme-btn" title="Theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16a5 5 0 0 0 0-10h-4z"/></svg></button>
      <button class="btn-icon" id="menu-btn" title="More"><svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="results">Results</button>
      <button class="tab-btn" data-tab="queue">Queue <span id="queue-count">(0)</span></button>
      <button class="tab-btn" data-tab="favorites">Favs <span id="fav-count">(0)</span></button>
      <button class="tab-btn" data-tab="recent">Recent</button>
      <button class="tab-btn" data-tab="playlists">Lists</button>
      <button class="tab-btn" data-tab="discover">Discover</button>
    </div>

    <div id="results-list" class="list-container show"></div>
    <div id="queue-list" class="list-container"></div>
    <div id="favorites-list" class="list-container"></div>
    <div id="recent-list" class="list-container"></div>
    <div id="playlists-list" class="list-container"></div>
    <div id="discover-list" class="list-container"></div>

    <div class="cover-wrapper">
      <div id="cover-glow" class="cover-glow"></div>
      <div id="cover" class="cover-art"></div>
      <div class="viz" id="viz"><span></span><span></span><span></span><span></span><span></span></div>
    </div>

    <div class="track-header">
      <div class="track-desc">
        <div id="title" class="current-title">Ready to stream</div>
        <div id="artist" class="current-artist">Search any track to begin</div>
      </div>
      <button class="btn-heart" id="heart-btn" title="Favorite"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
    </div>

    <div class="timeline">
      <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1" />
      <div class="time-stamps"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
    </div>

    <div class="vol-row">
      <button class="btn-ctrl" id="mute-btn" style="width:36px;height:36px" title="Mute"><svg id="vol-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
      <input type="range" id="vol-bar" class="vol-slider" value="80" min="0" max="100" step="1" />
    </div>

    <div class="playback-controls">
      <button class="btn-ctrl mode-btn" id="shuffle-btn" title="Shuffle"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
      <button class="btn-ctrl" id="prev-btn" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="btn-ctrl btn-play" id="play-btn"><svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="btn-ctrl" id="next-btn" title="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button class="btn-ctrl mode-btn" id="repeat-btn" title="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    </div>

    <div class="extra-row">
      <button class="extra-btn" id="rewind-btn"><svg viewBox="0 0 24 24"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg><span>-10s</span></button>
      <button class="extra-btn" id="forward-btn"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg><span>+10s</span></button>
      <button class="extra-btn" id="sleep-btn"><svg viewBox="0 0 24 24"><path d="M12.34 2.02C6.59 1.82 2 6.42 2 12c0 5.52 4.48 10 10 10 3.71 0 6.93-2.02 8.66-5.02-7.51-.25-12.09-8.43-8.32-14.96z"/></svg><span>Sleep</span></button>
      <button class="extra-btn" id="lyrics-btn"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg><span>Lyrics</span></button>
      <button class="extra-btn" id="strobe-btn"><svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg><span>Strobe</span></button>
      <button class="extra-btn" id="share-btn" style="color:#22c55e"><svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.196 8.196 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.64c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.03-1.25-.75-.67-1.26-1.5-1.41-1.75-.15-.25-.02-.39.11-.51.11-.11.25-.29.37-.44.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.34-.76-1.84-.2-.49-.4-.42-.56-.43h-.47c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.13.17 1.77 2.71 4.3 3.8.6.26 1.07.41 1.44.53.61.19 1.16.16 1.6.1.49-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.17-.47-.3z"/></svg><span>Share</span></button>
    </div>
  </div>

  <div id="yt-hidden-wrapper"><div id="yt-player"></div></div>

  <div class="sheet-overlay" id="menu-sheet">
    <div class="sheet">
      <div class="sheet-header"><div class="sheet-title">More options</div><button class="sheet-close" data-close>×</button></div>
      <button class="sheet-btn" id="export-btn" style="margin-bottom:10px">Export Favorites (JSON)</button>
      <button class="sheet-btn" id="import-btn" style="margin-bottom:10px;background:var(--surface);color:var(--text)">Import Favorites</button>
      <input type="file" id="import-file" accept=".json" style="display:none" />

  <script>

    const pwaManifest = { name: "Aura Music Player", short_name: "Aura", start_url: "./", display: "standalone", background_color: "#07090e", theme_color: "#07090e", icons: [{ src: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=192", sizes: "192x192", type: "image/jpeg" }, { src: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=512", sizes: "512x512", type: "image/jpeg" }] };

    const GENRES = [

    let player = null, isPlaying = false, progressTimer = null, currentTrack = null, activeQueue = [], queueIndex = -1, shuffleOn = false, repeatMode = 0;
    let favorites = JSON.parse(localStorage.getItem("aura_favs") || "[]"), recent = JSON.parse(localStorage.getItem("aura_recent") || "[]");

    const tag = document.createElement("script"); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("yt-player", {

    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.PLAYING) {
        isPlaying = true; setPlayIcon(false); coverEl.classList.add("playing"); viz.classList.add("show"); startProgressTracking();
        if (strobeActive) startStrobeLoop();

        isPlaying = false; setPlayIcon(true); coverEl.classList.remove("playing"); viz.classList.remove("show"); stopProgressTracking();
        stopStrobeLoop();
      }
      if (e.data === YT.PlayerState.ENDED) { if (repeatMode === 1) { player.seekTo(0, true); player.playVideo(); } else { playNextTrack(); } }
    }

    function setPlayIcon(showPlay) { playIcon.innerHTML = showPlay ? `<path d="M8 5v14l11-7z"/>` : `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`; }
    function decodeHtml(html) { const t = document.createElement("textarea"); t.innerHTML = html || ""; return t.value; }
    function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); setTimeout(() => toastEl.classList.remove("show"), 2200); }
    function formatTime(sec) { if (isNaN(sec)) return "0:00"; const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return `${m}:${s < 10 ? "0" : ""}${s}`; }
    function extractVideoId(input) { const m = input.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/); return m ? m[1] : null; }
    function extractPlaylistId(input) { const m = input.match(/[?&]list=([a-zA-Z0-9_-]+)/); return m ? m[1] : null; }

    // ================= WHATSAPP SHARING FEATURE =================
    function shareOnWhatsApp() {
      if (!currentTrack || !currentTrack.id) return toast("Play a song first to share!");
      const siteUrl = `${window.location.origin}${window.location.pathname}?v=${currentTrack.id}`;
      const shareText = `Listening to *${currentTrack.title}* by _${currentTrack.artist}_ on Aura Player! 🎵\n\nListen directly here:\n${siteUrl}`;
      const waUrl = `whatsapp://send?text=${encodeURIComponent(shareText)}`;
      const fallbackWebUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;

      // Attempt native WhatsApp protocol, fallback to web API
      const testLink = document.createElement("a");
      testLink.href = waUrl;
      testLink.click();
      setTimeout(() => { window.open(fallbackWebUrl, "_blank"); }, 300);
      toast("Opening WhatsApp...");
    }
    shareBtn.onclick = shareOnWhatsApp;

    // Check if shared link was opened or restore previous session
    async function checkSharedUrlOrRestore() {
      const params = new URLSearchParams(window.location.search);
      const sharedVid = params.get("v");
      if (sharedVid && sharedVid.length === 11) {
        toast("Loading shared song...");
        try {
          const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${sharedVid}&key=${YOUTUBE_API_KEY}`);
          const data = await res.json();
          if (data.items?.length) {
            const item = data.items[0];
            const track = {
              id: sharedVid,
              title: decodeHtml(item.snippet.title),
              artist: decodeHtml(item.snippet.channelTitle),
              cover: item.snippet.thumbnails.high?.url || item.snippet.thumbnails.default.url
            };
            activeQueue = [track];
            queueIndex = 0;
            loadTrack(track);
            return;
          }
        } catch (e) {}
        loadTrack({ id: sharedVid, title: "Shared Track", artist: "Aura Player", cover: `https://img.youtube.com/vi/${sharedVid}/hqdefault.jpg` });
        return;
      }
      restoreSavedSession();
    }

    // ================= PERSISTENT PLAYBACK ENGINE =================
    function saveCurrentSession(curTime) {
      if (!currentTrack) return;
      localStorage.setItem("aura_last_session", JSON.stringify({
        track: currentTrack,
        time: curTime || 0,
        queue: activeQueue,
        queueIdx: queueIndex,
        timestamp: Date.now()
      }));
    }

    function restoreSavedSession() {
      const raw = localStorage.getItem("aura_last_session");
      if (!raw) return;
      try {
        const session = JSON.parse(raw);
        if (!session.track || !session.track.id) return;
        currentTrack = session.track;
        if (session.queue && session.queue.length) activeQueue = session.queue;
        queueIndex = session.queueIdx ?? -1;
        updateQueueCount();

        titleEl.textContent = currentTrack.title;
        artistEl.textContent = currentTrack.artist + " (Resume ready)";
        coverEl.style.backgroundImage = `url(${currentTrack.cover})`;
        coverGlowEl.style.backgroundImage = `url(${currentTrack.cover})`;
        updateHeartState();

        const resumeTime = session.time || 0;
        currentTimeEl.textContent = formatTime(resumeTime);
        pendingResumeSeek = resumeTime;

        if (player && player.cueVideoById) {
          player.cueVideoById({
            videoId: currentTrack.id,
            startSeconds: resumeTime
          });
        }
        toast("Resumed last session. Tap Play!");
      } catch (e) {}
    }

    function toggleStrobe() {
      strobeActive = !strobeActive;
      strobeBtn.classList.toggle("strobe-on", strobeActive);
      if (strobeActive) {
        toast("⚡ Party Strobe Activated");
        if (isPlaying) startStrobeLoop();
      } else {
        stopStrobeLoop(); resetStrobeClasses(); toast("Strobe Deactivated");
      }
    }

    function startStrobeLoop() {
      stopStrobeLoop();
      const strobeStyles = ['strobe-color-1', 'strobe-color-2', 'strobe-color-3', 'strobe-color-4', 'strobe-flash'];
      strobeTimer = setInterval(() => {
        resetStrobeClasses(); strobeBeatCount++;
        const chosen = (strobeBeatCount % 8 === 0) ? 'strobe-flash' : strobeStyles[strobeBeatCount % 4];
        document.body.classList.add(chosen); playerCard.classList.add('strobe-pulse-card');
        setTimeout(() => { document.body.classList.remove('strobe-flash'); playerCard.classList.remove('strobe-pulse-card'); }, 110);
      }, 340);
    }

    function stopStrobeLoop() { if (strobeTimer) { clearInterval(strobeTimer); strobeTimer = null; } }
    function resetStrobeClasses() { document.body.classList.remove('strobe-flash', 'strobe-color-1', 'strobe-color-2', 'strobe-color-3', 'strobe-color-4'); playerCard.classList.remove('strobe-pulse-card'); }
    strobeBtn.onclick = toggleStrobe;

    async function fetchRelatedAutoplay(videoId) {
      try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&relatedToVideoId=${videoId}&type=video&maxResults=6&key=${YOUTUBE_API_KEY}`;
        const res = await fetch(url), data = await res.json();
        if (data.items?.length) {
          const newTracks = data.items.map(i => ({ id: i.id.videoId, title: decodeHtml(i.snippet.title), artist: decodeHtml(i.snippet.channelTitle), cover: i.snippet.thumbnails.high?.url || i.snippet.thumbnails.default.url }));
          activeQueue.push(...newTracks); updateQueueCount(); toast("Auto-Radio: Added similar songs to queue");
        }
      } catch (e) {}
    }

    async function loadLyrics(track) {
      lyricsTitle.textContent = `${track.title} - Lyrics`; lyricsContent.innerHTML = "Fetching lyrics..."; parsedLyrics = []; isSyncedLyrics = false;
      try {
        const cleanTitle = track.title.replace(/\([^)]*\)|\[[^\]]*\]|ft\..*|feat\..*|official.*|video.*|audio.*/gi, '').trim();
        const url = `https://lrclib.net/api/get?track_name=${encodeURIComponent(cleanTitle)}&artist_name=${encodeURIComponent(track.artist.replace(/vevo|official|channel/gi, '').trim())}`;
        const res = await fetch(url), data = await res.json();
        if (data.syncedLyrics) {
          isSyncedLyrics = true;
          parsedLyrics = data.syncedLyrics.split('\n').map(line => {
            const m = line.match(/\[(\d{2}):(\d{2}\.\d{2})\](.*)/);
            return m ? { time: parseInt(m[1]) * 60 + parseFloat(m[2]), text: m[3].trim() } : null;
          }).filter(Boolean);
          lyricsContent.innerHTML = parsedLyrics.map((l, i) => `<div class="lyric-line" id="lyric-${i}">${l.text || "♪"}</div>`).join("");
        } else if (data.plainLyrics) {
          lyricsContent.innerHTML = data.plainLyrics.split('\n').map(l => `<div class="lyric-line">${l || "<br>"}</div>`).join("");
        } else {
          lyricsContent.innerHTML = `No direct lyrics found.<br><button class="sheet-btn" style="margin-top:14px;width:auto;padding:8px 16px" onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(track.title + ' lyrics')}')">Search on Google</button>`;
        }
      } catch (e) {
        lyricsContent.innerHTML = `Unable to load lyrics.<br><button class="sheet-btn" style="margin-top:14px;width:auto;padding:8px 16px" onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(track.title + ' lyrics')}')">Search on Google</button>`;
      }
    }

    function syncLyricsDisplay(curTime) {
      if (!isSyncedLyrics || !parsedLyrics.length) return;
      let activeIdx = -1;
      for (let i = 0; i < parsedLyrics.length; i++) { if (curTime >= parsedLyrics[i].time) activeIdx = i; else break; }
      if (activeIdx !== -1) {
        document.querySelectorAll(".lyric-line").forEach((el, idx) => el.classList.toggle("active", idx === activeIdx));
        const activeEl = document.getElementById(`lyric-${activeIdx}`);
        if (activeEl) activeEl.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    async function loadPublicPlaylistUrl(playlistId) {
      toast("Loading full playlist..."); searchBtn.innerHTML = "<span>...</span>";
      try {
        const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=40&playlistId=${playlistId}&key=${YOUTUBE_API_KEY}`;
        const res = await fetch(url), data = await res.json();
        if (data.error) return toast(data.error.message || "Playlist error");
        const tracks = (data.items || []).filter(item => item.snippet?.resourceId?.videoId).map(item => {
          const vid = item.snippet.resourceId.videoId;
          return { id: vid, title: decodeHtml(item.snippet.title), artist: decodeHtml(item.snippet.videoOwnerChannelTitle || item.snippet.channelTitle || "YouTube"), cover: item.snippet.thumbnails?.high?.url || item.snippet.thumbnails?.default?.url || `https://img.youtube.com/vi/${vid}/hqdefault.jpg` };
        }).filter(t => t.title && !t.title.toLowerCase().includes("private") && !t.title.toLowerCase().includes("deleted"));
        if (!tracks.length) return toast("No playable tracks found in playlist");
        activeQueue = tracks; queueIndex = 0; renderTrackList(resultsList, tracks, "results"); switchTab("results"); updateQueueCount(); loadTrack(tracks[0]); toast(`Loaded ${tracks.length} tracks!`);
      } catch (e) { toast("Failed to load playlist URL"); }
      finally { searchBtn.innerHTML = "<span>Find</span>"; searchInput.value = ""; }
    }

    async function loadGenrePlaylist(genre) {
      const cacheKey = `aura_genre_${genre.id}`, cached = localStorage.getItem(cacheKey);
      if (cached) {
        try {
          const { tracks, timestamp, playlistTitle } = JSON.parse(cached);
          if (Date.now() - timestamp < 12 * 3600 * 1000 && tracks?.length) { activeQueue = tracks; queueIndex = -1; renderTrackList(resultsList, tracks, "results"); switchTab("results"); updateQueueCount(); toast(`Loaded: ${playlistTitle || genre.name}`); return; }
        } catch (e) {}
      }
      toast(`Loading ${genre.name} playlist...`);
      try {
        const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=playlist&maxResults=6&q=${encodeURIComponent(genre.query)}&key=${YOUTUBE_API_KEY}`;
        const searchRes = await fetch(searchUrl), searchData = await searchRes.json();
        if (searchData.error) return toast(searchData.error.message || "API Error");
        if (!searchData.items?.length) return toast("No playlists found for " + genre.name);

        const best = searchData.items[0], playlistId = best.id.playlistId, playlistTitle = decodeHtml(best.snippet.title);
        const itemsUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=30&playlistId=${playlistId}&key=${YOUTUBE_API_KEY}`;
        const itemsRes = await fetch(itemsUrl), itemsData = await itemsRes.json();
        if (itemsData.error) return toast(itemsData.error.message || "Could not load playlist");

        const tracks = (itemsData.items || []).filter(item => item.snippet?.resourceId?.videoId).map(item => {
          const vid = item.snippet.resourceId.videoId;
          return { id: vid, title: decodeHtml(item.snippet.title), artist: decodeHtml(item.snippet.videoOwnerChannelTitle || item.snippet.channelTitle || "YouTube"), cover: item.snippet.thumbnails?.high?.url || item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url || `https://img.youtube.com/vi/${vid}/hqdefault.jpg` };
        }).filter(t => t.title && !t.title.toLowerCase().includes("private") && !t.title.toLowerCase().includes("deleted"));

        if (!tracks.length) return toast("This playlist has no playable tracks");
        localStorage.setItem(cacheKey, JSON.stringify({ tracks, timestamp: Date.now(), playlistTitle }));
        activeQueue = tracks; queueIndex = -1; renderTrackList(resultsList, tracks, "results"); switchTab("results"); updateQueueCount(); toast(`Loaded: ${playlistTitle}`);
      } catch (err) { toast("Failed to load playlist. Check network."); }
    }

    function renderDiscover() {
      discoverList.innerHTML = "";

        const row = document.createElement("div"); row.className = "genre-row";

    async function handleSearch() {
      const query = searchInput.value.trim(); if (!query) return;
      const playlistId = extractPlaylistId(query);
      if (playlistId) return loadPublicPlaylistUrl(playlistId);
      const directId = extractVideoId(query);
      if (directId) { loadTrack({ id: directId, title: "Direct Video Stream", artist: "YouTube", cover: `https://img.youtube.com/vi/${directId}/hqdefault.jpg` }); searchInput.value = ""; return; }
      if (!searchHistory.includes(query)) { searchHistory.unshift(query); if (searchHistory.length > 12) searchHistory.pop(); localStorage.setItem("aura_history", JSON.stringify(searchHistory)); }

      searchBtn.innerHTML = "<span>...</span>";
      try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=12&q=${encodeURIComponent(query)}&key=${YOUTUBE_API_KEY}`;
        const res = await fetch(url), data = await res.json();
        if (data.error) return toast(data.error.message || "API Error");
        const items = (data.items || []).map(item => ({ id: item.id.videoId, title: decodeHtml(item.snippet.title), artist: decodeHtml(item.snippet.channelTitle), cover: item.snippet.thumbnails.high?.url || item.snippet.thumbnails.default.url }));
        if (!items.length) return toast("No songs found");
        activeQueue = items; queueIndex = -1; renderTrackList(resultsList, items, "results"); switchTab("results"); updateQueueCount();
      } catch (err) { toast("Search error: check network"); }
      finally { searchBtn.innerHTML = "<span>Find</span>"; }
    }

    function renderTrackList(container, tracks, type) {
      container.innerHTML = "";
      if (!tracks.length) { container.innerHTML = `<div class="empty-state">${type === "favorites" ? "No favorites yet" : type === "queue" ? "Queue is empty" : type === "recent" ? "Nothing played yet" : "No results"}</div>`; return; }
      tracks.forEach((track, idx) => {
        const row = document.createElement("div"); row.className = "track-row" + (currentTrack && currentTrack.id === track.id ? " active" : "");
        row.innerHTML = `<img src="${track.cover}" class="track-thumb" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400'" /><div class="track-meta"><div class="track-name">${track.title}</div><div class="track-channel">${track.artist}</div></div><div class="track-actions"><button data-act="queue" title="Add to queue">＋</button><button data-act="plist" title="Add to playlist">☰</button></div>`;
        row.querySelector("[data-act=queue]").onclick = (e) => { e.stopPropagation(); addToQueue(track); };
        row.querySelector("[data-act=plist]").onclick = (e) => { e.stopPropagation(); openAddToPlaylist(track); };
        row.onclick = () => { if (type === "queue") { queueIndex = idx; loadTrack(track); } else { activeQueue = tracks; queueIndex = idx; loadTrack(track); updateQueueCount(); } };
        container.appendChild(row);
      });
    }

    function renderPlaylists() {
      playlistsList.innerHTML = ""; const names = Object.keys(playlists);
      if (!names.length) { playlistsList.innerHTML = `<div class="empty-state">No playlists<br><button class="btn-action" style="margin-top:10px" id="new-pl-btn">Create one</button></div>`; $("new-pl-btn")?.addEventListener("click", () => openSheet("playlist-sheet")); return; }
      const createRow = document.createElement("div"); createRow.className = "track-row"; createRow.innerHTML = `<div class="track-meta"><div class="track-name">＋ New Playlist</div></div>`; createRow.onclick = () => openSheet("playlist-sheet"); playlistsList.appendChild(createRow);
      names.forEach(name => {
        const tracks = playlists[name], row = document.createElement("div"); row.className = "track-row";
        row.innerHTML = `<div class="track-meta"><div class="track-name">${name}</div><div class="track-channel">${tracks.length} tracks</div></div><div class="track-actions"><button data-act="play">▶</button><button data-act="del">✕</button></div>`;
        row.querySelector("[data-act=play]").onclick = (e) => { e.stopPropagation(); if (!tracks.length) return toast("Empty playlist"); activeQueue = [...tracks]; queueIndex = 0; loadTrack(tracks[0]); updateQueueCount(); switchTab("queue"); };

  <script>
    const YOUTUBE_API_KEY = "AIzaSyCJuQ8KoTdihisteVC-HB_APmNWqLofBoc";

    const pwaManifest = { name: "Aura Music Player", short_name: "Aura", start_url: "./", display: "standalone", background_color: "#07090e", theme_color: "#07090e", icons: [{ src: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=192", sizes: "192x192", type: "image/jpeg" }, { src: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=512", sizes: "512x512", type: "image/jpeg" }] };
    document.getElementById("pwa-manifest").setAttribute("href", "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(pwaManifest)));
    if ('serviceWorker' in navigator) { const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));`; const swBlob = new Blob([swCode], { type: 'application/javascript' }); navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {}); }

    const GENRES = [
      { id: "bhakti", name: "Bhakti", icon: "🙏", query: "bhakti bhajan songs playlist" },
      { id: "romance", name: "Romance", icon: "❤️", query: "romantic bollywood songs playlist" },
      { id: "party", name: "Party", icon: "🎉", query: "bollywood party dance songs playlist" },

      { id: "devotional", name: "Devotional", icon: "🛕", query: "hindu devotional songs playlist" },
      { id: "workout", name: "Workout", icon: "💪", query: "gym workout motivation songs playlist" }
    ];

    let player = null, isPlaying = false, progressTimer = null, currentTrack = null, activeQueue = [], queueIndex = -1, shuffleOn = false, repeatMode = 0;
    let favorites = JSON.parse(localStorage.getItem("aura_favs") || "[]"), recent = JSON.parse(localStorage.getItem("aura_recent") || "[]");
    let playlists = JSON.parse(localStorage.getItem("aura_playlists") || "{}"), searchHistory = JSON.parse(localStorage.getItem("aura_history") || "[]");

    const strobeBtn = $("strobe-btn"), shareBtn = $("share-btn"), playerCard = $("player-container");

    const tag = document.createElement("script"); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("yt-player", {
        height: "200", width: "200",
        playerVars: { playsinline: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0, iv_load_policy: 3 },
        events: {

            checkSharedUrlOrRestore();

          onStateChange: onPlayerStateChange
        }

    };

    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.PLAYING) {
        isPlaying = true; setPlayIcon(false); coverEl.classList.add("playing"); viz.classList.add("show"); startProgressTracking();
        if (strobeActive) startStrobeLoop();
      } else {
        isPlaying = false; setPlayIcon(true); coverEl.classList.remove("playing"); viz.classList.remove("show"); stopProgressTracking();
        stopStrobeLoop();
      }
      if (e.data === YT.PlayerState.ENDED) { if (repeatMode === 1) { player.seekTo(0, true); player.playVideo(); } else { playNextTrack(); } }
    }

    function setPlayIcon(showPlay) { playIcon.innerHTML = showPlay ? `<path d="M8 5v14l11-7z"/>` : `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`; }
    function decodeHtml(html) { const t = document.createElement("textarea"); t.innerHTML = html || ""; return t.value; }
    function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); setTimeout(() => toastEl.classList.remove("show"), 2200); }
    function formatTime(sec) { if (isNaN(sec)) return "0:00"; const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return `${m}:${s < 10 ? "0" : ""}${s}`; }
    function extractVideoId(input) { const m = input.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/); return m ? m[1] : null; }
    function extractPlaylistId(input) { const m = input.match(/[?&]list=([a-zA-Z0-9_-]+)/); return m ? m[1] : null; }

    async function shareOnWhatsApp() {
      if (!currentTrack || !currentTrack.id) return toast("Play a song first to share!");
      const cleanTitle = currentTrack.title || "Track";
      const cleanArtist = currentTrack.artist || "Artist";
      const songUrl = `${window.location.origin}${window.location.pathname}?v=${currentTrack.id}&title=${encodeURIComponent(cleanTitle)}`;
      const messageBody = `🎶 *Now Playing on Aura:*\n\n🎵 *Song:* ${cleanTitle}\n👤 *Artist:* ${cleanArtist}\n\n▶️ *Listen instantly:* ${songUrl}`;

      if (navigator.share) {
        try {
          await navigator.share({ title: `🎵 ${cleanTitle}`, text: messageBody });
          return;
        } catch (err) { if (err.name === "AbortError") return; }
      }

      const waUrl = `whatsapp://send?text=${encodeURIComponent(messageBody)}`;
      const webUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(messageBody)}`;
      const link = document.createElement("a");
      link.href = waUrl; link.click();
      setTimeout(() => { window.open(webUrl, "_blank"); }, 350);
      toast(`Sharing: ${cleanTitle}`);

    shareBtn.onclick = shareOnWhatsApp;

    async function checkSharedUrlOrRestore() {
      const params = new URLSearchParams(window.location.search);
      const sharedVid = params.get("v"), sharedTitle = params.get("title");
      if (sharedVid && sharedVid.length === 11) {
        toast("Opening shared song...");
        const fallbackTrack = { id: sharedVid, title: sharedTitle ? decodeURIComponent(sharedTitle) : "Shared Track", artist: "Aura Player", cover: `https://img.youtube.com/vi/${sharedVid}/hqdefault.jpg` };
        try {
          const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${sharedVid}&key=${YOUTUBE_API_KEY}`);
          const data = await res.json();
          if (data.items?.length) {
            const item = data.items[0];
            const track = { id: sharedVid, title: decodeHtml(item.snippet.title), artist: decodeHtml(item.snippet.channelTitle), cover: item.snippet.thumbnails.high?.url || item.snippet.thumbnails.default.url };
            activeQueue = [track]; queueIndex = 0; loadTrack(track); return;

        } catch (e) {}
        activeQueue = [fallbackTrack]; queueIndex = 0; loadTrack(fallbackTrack); return;
      }
      restoreSavedSession();
    }

    function saveCurrentSession(curTime) {
      if (!currentTrack) return;
      localStorage.setItem("aura_last_session", JSON.stringify({ track: currentTrack, time: curTime || 0, queue: activeQueue, queueIdx: queueIndex, timestamp: Date.now() }));
    }

    function restoreSavedSession() {
      const raw = localStorage.getItem("aura_last_session");
      if (!raw) return;
      try {
        const session = JSON.parse(raw);
        if (!session.track || !session.track.id) return;
        currentTrack = session.track;
        if (session.queue && session.queue.length) activeQueue = session.queue;
        queueIndex = session.queueIdx ?? -1;
        updateQueueCount();

        titleEl.textContent = currentTrack.title;
        artistEl.textContent = currentTrack.artist + " (Resume ready)";
        coverEl.style.backgroundImage = `url(${currentTrack.cover})`;

    function startStrobeLoop() {

        if (strobeBeatCount % 8 === 0) {

    async function fetchRelatedAutoplay(videoId) {
      try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&relatedToVideoId=${videoId}&type=video&maxResults=6&key=${YOUTUBE_API_KEY}`;
        const res = await fetch(url), data = await res.json();
        if (data.items?.length) {
          const newTracks = data.items.map(i => ({ id: i.id.videoId, title: decodeHtml(i.snippet.title), artist: decodeHtml(i.snippet.channelTitle), cover: i.snippet.thumbnails.high?.url || i.snippet.thumbnails.default.url }));
          activeQueue.push(...newTracks); updateQueueCount(); toast("Auto-Radio: Added similar songs to queue");
        }
      } catch (e) {}
    }

    async function loadLyrics(track) {
      lyricsTitle.textContent = `${track.title} - Lyrics`; lyricsContent.innerHTML = "Fetching lyrics..."; parsedLyrics = []; isSyncedLyrics = false;
      try {
        const cleanTitle = track.title.replace(/\([^)]*\)|\[[^\]]*\]|ft\..*|feat\..*|official.*|video.*|audio.*/gi, '').trim();
        const url = `https://lrclib.net/api/get?track_name=${encodeURIComponent(cleanTitle)}&artist_name=${encodeURIComponent(track.artist.replace(/vevo|official|channel/gi, '').trim())}`;
        const res = await fetch(url), data = await res.json();
        if (data.syncedLyrics) {
          isSyncedLyrics = true;
          parsedLyrics = data.syncedLyrics.split('\n').map(line => {
            const m = line.match(/\[(\d{2}):(\d{2}\.\d{2})\](.*)/);
            return m ? { time: parseInt(m[1]) * 60 + parseFloat(m[2]), text: m[3].trim() } : null;
          }).filter(Boolean);
          lyricsContent.innerHTML = parsedLyrics.map((l, i) => `<div class="lyric-line" id="lyric-${i}">${l.text || "♪"}</div>`).join("");
        } else if (data.plainLyrics) {
          lyricsContent.innerHTML = data.plainLyrics.split('\n').map(l => `<div class="lyric-line">${l || "<br>"}</div>`).join("");
        } else {
          lyricsContent.innerHTML = `No direct lyrics found.<br><button class="sheet-btn" style="margin-top:14px;width:auto;padding:8px 16px" onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(track.title + ' lyrics')}')">Search on Google</button>`;
        }
      } catch (e) {
        lyricsContent.innerHTML = `Unable to load lyrics.<br><button class="sheet-btn" style="margin-top:14px;width:auto;padding:8px 16px" onclick="window.open('https://www.google.com/search?q=${encodeURIComponent(track.title + ' lyrics')}')">Search on Google</button>`;
      }
    }

    function syncLyricsDisplay(curTime) {
      if (!isSyncedLyrics || !parsedLyrics.length) return;
      let activeIdx = -1;
      for (let i = 0; i < parsedLyrics.length; i++) { if (curTime >= parsedLyrics[i].time) activeIdx = i; else break; }
      if (activeIdx !== -1) {
        document.querySelectorAll(".lyric-line").forEach((el, idx) => el.classList.toggle("active", idx === activeIdx));
        const activeEl = document.getElementById(`lyric-${activeIdx}`);
        if (activeEl) activeEl.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    async function loadPublicPlaylistUrl(playlistId) {
      toast("Loading full playlist..."); searchBtn.innerHTML = "<span>...</span>";
      try {
        const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=40&playlistId=${playlistId}&key=${YOUTUBE_API_KEY}`;
        const res = await fetch(url), data = await res.json();
        if (data.error) return toast(data.error.message || "Playlist error");
        const tracks = (data.items || []).filter(item => item.snippet?.resourceId?.videoId).map(item => {
          const vid = item.snippet.resourceId.videoId;
          return { id: vid, title: decodeHtml(item.snippet.title), artist: decodeHtml(item.snippet.videoOwnerChannelTitle || item.snippet.channelTitle || "YouTube"), cover: item.snippet.thumbnails?.high?.url || item.snippet.thumbnails?.default?.url || `https://img.youtube.com/vi/${vid}/hqdefault.jpg` };
        }).filter(t => t.title && !t.title.toLowerCase().includes("private") && !t.title.toLowerCase().includes("deleted"));
        if (!tracks.length) return toast("No playable tracks found in playlist");
        activeQueue = tracks; queueIndex = 0; renderTrackList(resultsList, tracks, "results"); switchTab("results"); updateQueueCount(); loadTrack(tracks[0]); toast(`Loaded ${tracks.length} tracks!`);
      } catch (e) { toast("Failed to load playlist URL"); }
      finally { searchBtn.innerHTML = "<span>Find</span>"; searchInput.value = ""; }
    }

    async function loadGenrePlaylist(genre) {
      const cacheKey = `aura_genre_${genre.id}`, cached = localStorage.getItem(cacheKey);
      if (cached) {
        try {
          const { tracks, timestamp, playlistTitle } = JSON.parse(cached);
          if (Date.now() - timestamp < 12 * 3600 * 1000 && tracks?.length) { activeQueue = tracks; queueIndex = -1; renderTrackList(resultsList, tracks, "results"); switchTab("results"); updateQueueCount(); toast(`Loaded: ${playlistTitle || genre.name}`); return; }
        } catch (e) {}
      }
      toast(`Loading ${genre.name} playlist...`);
      try {
        const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=playlist&maxResults=6&q=${encodeURIComponent(genre.query)}&key=${YOUTUBE_API_KEY}`;
        const searchRes = await fetch(searchUrl), searchData = await searchRes.json();
        if (searchData.error) return toast(searchData.error.message || "API Error");
        if (!searchData.items?.length) return toast("No playlists found for " + genre.name);

        const best = searchData.items[0], playlistId = best.id.playlistId, playlistTitle = decodeHtml(best.snippet.title);
        const itemsUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=30&playlistId=${playlistId}&key=${YOUTUBE_API_KEY}`;
        const itemsRes = await fetch(itemsUrl), itemsData = await itemsRes.json();
        if (itemsData.error) return toast(itemsData.error.message || "Could not load playlist");

        const tracks = (itemsData.items || []).filter(item => item.snippet?.resourceId?.videoId).map(item => {
          const vid = item.snippet.resourceId.videoId;
          return { id: vid, title: decodeHtml(item.snippet.title), artist: decodeHtml(item.snippet.videoOwnerChannelTitle || item.snippet.channelTitle || "YouTube"), cover: item.snippet.thumbnails?.high?.url || item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url || `https://img.youtube.com/vi/${vid}/hqdefault.jpg` };
        }).filter(t => t.title && !t.title.toLowerCase().includes("private") && !t.title.toLowerCase().includes("deleted"));

        if (!tracks.length) return toast("This playlist has no playable tracks");
        localStorage.setItem(cacheKey, JSON.stringify({ tracks, timestamp: Date.now(), playlistTitle }));
        activeQueue = tracks; queueIndex = -1; renderTrackList(resultsList, tracks, "results"); switchTab("results"); updateQueueCount(); toast(`Loaded: ${playlistTitle}`);
      } catch (err) { toast("Failed to load playlist. Check network."); }

    function renderDiscover() {
      discoverList.innerHTML = "";

        const row = document.createElement("div"); row.className = "genre-row";
        row.innerHTML = `<div class="genre-icon">${g.icon}</div><div class="genre-meta"><div class="genre-name">${g.name}</div><div class="genre-desc">Real YouTube playlist</div></div>`;

    async function handleSearch() {
      const query = searchInput.value.trim(); if (!query) return;
      const playlistId = extractPlaylistId(query);
      if (playlistId) return loadPublicPlaylistUrl(playlistId);
      const directId = extractVideoId(query);
      if (directId) { loadTrack({ id: directId, title: "Direct Video Stream", artist: "YouTube", cover: `https://img.youtube.com/vi/${directId}/hqdefault.jpg` }); searchInput.value = ""; return; }
      if (!searchHistory.includes(query)) { searchHistory.unshift(query); if (searchHistory.length > 12) searchHistory.pop(); localStorage.setItem("aura_history", JSON.stringify(searchHistory)); }

      searchBtn.innerHTML = "<span>...</span>";
      try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=12&q=${encodeURIComponent(query)}&key=${YOUTUBE_API_KEY}`;
        const res = await fetch(url), data = await res.json();
        if (data.error) return toast(data.error.message || "API Error");
        const items = (data.items || []).map(item => ({ id: item.id.videoId, title: decodeHtml(item.snippet.title), artist: decodeHtml(item.snippet.channelTitle), cover: item.snippet.thumbnails.high?.url || item.snippet.thumbnails.default.url }));
        if (!items.length) return toast("No songs found");
        activeQueue = items; queueIndex = -1; renderTrackList(resultsList, items, "results"); switchTab("results"); updateQueueCount();
      } catch (err) { toast("Search error: check network"); }
      finally { searchBtn.innerHTML = "<span>Find</span>"; }
    }

    function renderTrackList(container, tracks, type) {
      container.innerHTML = "";
      if (!tracks.length) { container.innerHTML = `<div class="empty-state">${type === "favorites" ? "No favorites yet" : type === "queue" ? "Queue is empty" : type === "recent" ? "Nothing played yet" : "No results"}</div>`; return; }
      tracks.forEach((track, idx) => {
        const row = document.createElement("div"); row.className = "track-row" + (currentTrack && currentTrack.id === track.id ? " active" : "");
        row.innerHTML = `<img src="${track.cover}" class="track-thumb" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400'" /><div class="track-meta"><div class="track-name">${track.title}</div><div class="track-channel">${track.artist}</div></div><div class="track-actions"><button data-act="queue" title="Add to queue">＋</button><button data-act="plist" title="Add to playlist">☰</button></div>`;

        row.querySelector("[data-act=plist]").onclick = (e) => { e.stopPropagation(); openAddToPlaylist(track); };
        row.onclick = () => { if (type === "queue") { queueIndex = idx; loadTrack(track); } else { activeQueue = tracks; queueIndex = idx; loadTrack(track); updateQueueCount(); } };

    function renderPlaylists() {
      playlistsList.innerHTML = ""; const names = Object.keys(playlists);
      if (!names.length) { playlistsList.innerHTML = `<div class="empty-state">No playlists<br><button class="btn-action" style="margin-top:10px" id="new-pl-btn">Create one</button></div>`; $("new-pl-btn")?.addEventListener("click", () => openSheet("playlist-sheet")); return; }
      const createRow = document.createElement("div"); createRow.className = "track-row"; createRow.innerHTML = `<div class="track-meta"><div class="track-name">＋ New Playlist</div></div>`; createRow.onclick = () => openSheet("playlist-sheet"); playlistsList.appendChild(createRow);

        row.innerHTML = `<div class="track-meta"><div class="track-name">${name}</div><div class="track-channel">${tracks.length} tracks</div></div><div class="track-actions"><button data-act="play">▶</button><button data-act="del">✕</button></div>`;
        row.querySelector("[data-act=play]").onclick = (e) => { e.stopPropagation(); if (!tracks.length) return toast("Empty playlist"); activeQueue = [...tracks]; queueIndex = 0; loadTrack(tracks[0]); updateQueueCount(); switchTab("queue"); };
        row.querySelector("[data-act=del]").onclick = (e) => { e.stopPropagation(); if (confirm(`Delete playlist "${name}"?`)) { delete playlists[name]; localStorage.setItem("aura_playlists", JSON.stringify(playlists)); renderPlaylists(); toast("Deleted"); } };

    function loadTrack(track, addToRecent = true, startSec = 0) {
      currentTrack = track; pendingResumeSeek = null;
      titleEl.textContent = track.title; artistEl.textContent = track.artist;
      coverEl.style.backgroundImage = `url(${track.cover})`; coverGlowEl.style.backgroundImage = `url(${track.cover})`; updateHeartState();

      if (player && player.loadVideoById) {
        player.loadVideoById({ videoId: track.id, startSeconds: startSec });
      }

      if (addToRecent) { recent = recent.filter(t => t.id !== track.id); recent.unshift(track); if (recent.length > 40) recent.pop(); localStorage.setItem("aura_recent", JSON.stringify(recent)); }
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({ title: track.title, artist: track.artist, artwork: [{ src: track.cover, sizes: "512x512", type: "image/jpeg" }] });
        navigator.mediaSession.setActionHandler("play", togglePlay); navigator.mediaSession.setActionHandler("pause", togglePlay);
        navigator.mediaSession.setActionHandler("previoustrack", playPrevTrack); navigator.mediaSession.setActionHandler("nexttrack", playNextTrack);
        navigator.mediaSession.setActionHandler("seekbackward", () => skip(-10)); navigator.mediaSession.setActionHandler("seekforward", () => skip(10));
      }
      if (activeQueue.length - queueIndex <= 1) fetchRelatedAutoplay(track.id);
      if ($("lyrics-sheet").classList.contains("show")) loadLyrics(track);
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        if (pendingResumeSeek !== null) {
          player.seekTo(pendingResumeSeek, true);
          pendingResumeSeek = null;
        }
        player.playVideo();
      }
    }

    function playNextTrack() {
      if (!activeQueue.length) return;
      if (shuffleOn) { queueIndex = Math.floor(Math.random() * activeQueue.length); }
      else { queueIndex = (queueIndex + 1) % activeQueue.length; if (queueIndex === 0 && repeatMode !== 2 && !shuffleOn) { player.pauseVideo(); return; } }
      loadTrack(activeQueue[queueIndex]);
    }

    function playPrevTrack() {
      if (!activeQueue.length) return;
      if (player?.getCurrentTime && player.getCurrentTime() > 3) { player.seekTo(0, true); return; }
      queueIndex = (queueIndex - 1 + activeQueue.length) % activeQueue.length; loadTrack(activeQueue[queueIndex]);
    }

    function skip(sec) { if (player?.getCurrentTime) player.seekTo(Math.max(0, player.getCurrentTime() + sec), true); }
    function addToQueue(track) { activeQueue.push(track); updateQueueCount(); if (document.querySelector('.tab-btn[data-tab="queue"].active')) renderTrackList(queueList, activeQueue, "queue"); toast("Added to queue"); }

    function startProgressTracking() {
      stopProgressTracking();
      progressTimer = setInterval(() => {
        if (!player || !player.getCurrentTime) return;
        const cur = player.getCurrentTime(), dur = player.getDuration();
        if (dur > 0) {
          seekBar.value = (cur / dur) * 100;
          currentTimeEl.textContent = formatTime(cur);
          durationEl.textContent = formatTime(dur);
          saveCurrentSession(cur);
        }
        syncLyricsDisplay(cur);
        if (sleepEnd && Date.now() >= sleepEnd) { player.pauseVideo(); clearSleep(); toast("Sleep timer ended"); }
      }, 350);
    }

    function stopProgressTracking() { clearInterval(progressTimer); }
    seekBar.addEventListener("input", () => {
      if (player?.getDuration) {
        const target = (seekBar.value / 100) * player.getDuration();
        player.seekTo(target, true);
        saveCurrentSession(target);
      }
    });

    volBar.value = volume;
    volBar.addEventListener("input", () => { volume = +volBar.value; isMuted = false; if (player?.setVolume) player.setVolume(volume); localStorage.setItem("aura_vol", volume); updateVolIcon(); });
    muteBtn.onclick = () => { isMuted = !isMuted; if (player?.setVolume) player.setVolume(isMuted ? 0 : volume); updateVolIcon(); };

    $("clear-queue-btn").onclick = () => { activeQueue = []; queueIndex = -1; updateQueueCount(); toast("Queue cleared"); closeSheets(); };

    document.addEventListener("keydown", e => {
      if (e.target.tagName === "INPUT") return;
      if (e.code === "Space") { e.preventDefault(); togglePlay(); }
      else if (e.code === "ArrowLeft") skip(-10);
      else if (e.code === "ArrowRight") skip(10);
      else if (e.code === "ArrowUp") { volume = Math.min(100, volume + 5); volBar.value = volume; if (player?.setVolume) player.setVolume(volume); }
      else if (e.code === "ArrowDown") { volume = Math.max(0, volume - 5); volBar.value = volume; if (player?.setVolume) player.setVolume(volume); }
      else if (e.key === "n" || e.key === "N") playNextTrack();
      else if (e.key === "p" || e.key === "P") playPrevTrack();
      else if (e.key === "f" || e.key === "F") heartBtn.click();
      else if (e.key === "/") { e.preventDefault(); searchInput.focus(); }
    });

    searchBtn.onclick = handleSearch;
    searchInput.onkeypress = e => { if (e.key === "Enter") handleSearch(); };
    $("play-btn").onclick = togglePlay;
    $("next-btn").onclick = playNextTrack;
    $("prev-btn").onclick = playPrevTrack;
    $("rewind-btn").onclick = () => skip(-10);
    $("forward-btn").onclick = () => skip(10);

    updateFavCount(); updateQueueCount(); updateVolIcon();

    if (localStorage.getItem("aura_strobe") === "1") {
      strobeActive = true;
      strobeBtn.classList.add("strobe-on");
    }

    searchInput.addEventListener("focus", () => {
      if (resultsList.children.length === 0 && searchHistory.length) {
        resultsList.innerHTML = `<div style="padding:10px;font-size:0.75rem;color:var(--text-muted)">Recent searches</div>`;
        searchHistory.forEach(q => {
          const chip = document.createElement("span"); chip.className = "history-chip"; chip.textContent = q;
          chip.onclick = () => { searchInput.value = q; handleSearch(); }; resultsList.appendChild(chip);
        });
        resultsList.classList.add("show");
      }
    });
  </script>
</body>
</html>
